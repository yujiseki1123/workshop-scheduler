<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スケジュール管理 PoC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body data-today="{{ today }}" data-weeks-ahead="{{ weeks_ahead }}" data-weeks-behind="{{ weeks_behind }}">
  <header class="page-header">
    <div class="page-header-top">
      <h1>ワークショップ スケジュール(PoC)</h1>
      <button id="view-toggle-btn" type="button" class="view-toggle-btn" aria-pressed="false">
        表示切替: 担当者別
      </button>
    </div>
    <p class="page-sub">
      横軸=日付(週単位グループ表示) / 縦軸=ワークショップ・プロジェクト(切替ボタンで担当者別表示にも変更できます)。
      バーにマウスを乗せるとタスクの詳細が表示されます。
    </p>
    <p id="source-info" class="page-sub source-info"></p>
    <div id="filter-bar" class="filter-bar"></div>
    <div id="warnings" class="warnings" hidden></div>
  </header>

  <div id="schedule-root" class="schedule-wrapper">
    <p class="loading">読み込み中...</p>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>

  <script src="{{ url_for('static', filename='js/schedule.js') }}"></script>
</body>
</html>
