<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ワークショップ スケジュール</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Microsoft サインイン(MSAL.js)と Excel の読み取り(SheetJS) -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header class="page-header">
    <div class="page-header-top">
      <h1>ワークショップ スケジュール</h1>
      <div class="header-actions">
        <span id="account-name" class="account-name"></span>
        <button id="reload-btn" type="button" class="header-btn" hidden>再読み込み</button>
        <button id="signout-btn" type="button" class="header-btn" hidden>サインアウト</button>
        <button id="view-toggle-btn" type="button" class="view-toggle-btn" aria-pressed="false">
          表示切替: 担当者別
        </button>
      </div>
    </div>
    <p class="page-sub">
      横軸=日付(週単位グループ表示) / 縦軸=ワークショップ・プロジェクト(切替ボタンで担当者別表示にも変更できます)。
      バーにマウスを乗せるとタスクの詳細が表示されます。データは OneDrive の Excel から読み込みます。
    </p>
    <p id="source-info" class="page-sub source-info"></p>
    <div id="filter-bar" class="filter-bar"></div>
    <div id="warnings" class="warnings" hidden></div>
  </header>

  <div id="schedule-root" class="schedule-wrapper">
    <p class="loading">読み込み中...</p>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/excel_source.js"></script>
  <script src="js/onedrive.js"></script>
  <script src="js/schedule.js"></script>
</body>
</html>
